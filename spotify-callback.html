<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify連携設定 | B'z Live Setlist DB</title>
<style>
:root{color-scheme:dark;--bg:#0f1117;--panel:#171a23;--line:#313749;--text:#f5f7fb;--muted:#a9b0c3;--green:#1ed760;--danger:#ff8e8e}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0f1117,#151a25);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:24px}
main{max-width:680px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.28)}h1{font-size:24px;margin:0 0 10px}p{color:var(--muted);line-height:1.7}.status{padding:12px 14px;border:1px solid var(--line);border-radius:13px;margin:16px 0;line-height:1.6}.ok{border-color:rgba(30,215,96,.55);color:#a7f3c0}.error{border-color:rgba(255,142,142,.55);color:var(--danger)}button{appearance:none;border:0;border-radius:999px;padding:12px 18px;background:var(--green);color:#07140c;font-weight:900;font-size:15px;cursor:pointer}button.secondary{background:#2b3140;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap}label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin:18px 0 6px}input{width:100%;background:#0b0d12;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.secret{filter:blur(5px)}.secret:focus{filter:none}.small{font-size:12px}.hidden{display:none}
</style>
</head>
<body>
<main><div class="card">
<h1>Spotify自動プレイリスト連携</h1>
<p>Spotifyへ一度だけ接続し、GitHub Actionsが公演ごとのプレイリストを自動作成できるようにします。Client SecretやSpotifyのパスワードは使用しません。</p>
<div id="status" class="status">接続待ちです。</div>
<div id="connectActions" class="actions"><button id="connectBtn">Spotifyと接続</button></div>
<section id="result" class="hidden">
  <label for="clientId">GitHub Secret: SPOTIFY_CLIENT_ID</label>
  <input id="clientId" readonly>
  <label for="refreshToken">GitHub Secret: SPOTIFY_REFRESH_TOKEN</label>
  <input id="refreshToken" class="secret" readonly>
  <p class="small">Refresh TokenはSpotifyアカウントを操作できる認証情報です。チャットや公開場所へ貼り付けないでください。</p>
  <div class="actions"><button id="copyClient" class="secondary">Client IDをコピー</button><button id="copyRefresh" class="secondary">Refresh Tokenをコピー</button></div>
</section>
</div></main>
<script>
const CLIENT_ID="3a0a207453e34980b39d96fa82b209d8";
const REDIRECT_URI="https://ai-z-lab.github.io/bz-setlist/spotify-callback.html";
const SCOPES="playlist-modify-public playlist-modify-private playlist-read-private";
const statusBox=document.querySelector("#status"),result=document.querySelector("#result"),clientIdInput=document.querySelector("#clientId"),refreshInput=document.querySelector("#refreshToken");
function setStatus(message,type=""){statusBox.textContent=message;statusBox.className=`status ${type}`.trim()}
function randomString(length=96){const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~",bytes=crypto.getRandomValues(new Uint8Array(length));return Array.from(bytes,b=>chars[b%chars.length]).join("")}
function base64url(buffer){return btoa(String.fromCharCode(...new Uint8Array(buffer))).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_")}
async function beginAuth(){
  const verifier=randomString(),state=randomString(32),challenge=base64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
  sessionStorage.setItem("spotify_pkce_verifier",verifier);sessionStorage.setItem("spotify_oauth_state",state);
  const url=new URL("https://accounts.spotify.com/authorize");
  url.search=new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT_URI,scope:SCOPES,state,code_challenge_method:"S256",code_challenge:challenge,show_dialog:"true"});
  location.assign(url);
}
async function finishAuth(code,state){
  const verifier=sessionStorage.getItem("spotify_pkce_verifier"),expected=sessionStorage.getItem("spotify_oauth_state");
  if(!verifier||!expected||state!==expected)throw new Error("認証状態を確認できません。最初から接続し直してください。");
  const response=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT_URI,code_verifier:verifier})});
  const body=await response.json();
  if(!response.ok)throw new Error(body.error_description||body.error||`HTTP ${response.status}`);
  if(!body.refresh_token)throw new Error("Refresh Tokenを取得できませんでした。");
  sessionStorage.removeItem("spotify_pkce_verifier");sessionStorage.removeItem("spotify_oauth_state");history.replaceState({},"",REDIRECT_URI);
  clientIdInput.value=CLIENT_ID;refreshInput.value=body.refresh_token;result.classList.remove("hidden");document.querySelector("#connectActions").classList.add("hidden");
  setStatus("Spotifyとの接続が完了しました。次は2つの値をGitHub Secretsへ登録します。","ok");
}
document.querySelector("#connectBtn").addEventListener("click",beginAuth);
document.querySelector("#copyClient").addEventListener("click",()=>navigator.clipboard.writeText(clientIdInput.value));
document.querySelector("#copyRefresh").addEventListener("click",()=>navigator.clipboard.writeText(refreshInput.value));
const params=new URLSearchParams(location.search);
if(params.get("error"))setStatus(`Spotify認証が中断されました: ${params.get("error")}`,"error");
else if(params.get("code")){setStatus("Spotifyの認証情報を受け取っています…");finishAuth(params.get("code"),params.get("state")).catch(error=>setStatus(error.message,"error"));}
</script>
</body>
</html>
